[package]
name = "endif-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
endif-sim = { path = "../sim" }
matchbox_signaling = "0.14"
matchbox_protocol = { version = "0.14", features = ["json"] }
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "mysql", "chrono"] }
argon2 = "0.6.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
dotenvy = "0.15.7"
sha2 = "0.11.0"
chrono = "0.4.45"
serde_json = "1.0.151"
rand = "0.8"
serde = { workspace = true, features = ["derive"] }
tower-http = { version = "0.7.1", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
